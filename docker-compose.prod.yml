# Attendrix Production Docker Compose Configuration
# Optimized for production deployment

version: '3.8'

services:
  # PostgreSQL Database with production optimizations
  db:
    image: postgres:15-alpine
    container_name: attendrix_db_prod
    restart: always
    environment:
      POSTGRES_DB: attendrix
      POSTGRES_USER: attendrix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - postgres_backups:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - attendrix_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendrix -d attendrix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Redis with production optimizations
  redis:
    image: redis:7-alpine
    container_name: attendrix_redis_prod
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data_prod:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - attendrix_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Django Web Application (production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_web_prod
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/media
      - logs_volume_prod:/app/logs
      - uploads_volume_prod:/app/uploads
      - ssl_certs:/etc/nginx/ssl
    ports:
      - "${WEB_PORT:-8000}:8000"
    networks:
      - attendrix_prod_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Worker (production)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_celery_prod
    restart: always
    command: celery -A attendrix worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000 --time-limit=300 --prefetch-multiplier=1 --autoscale=4,2
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - logs_volume_prod:/app/logs
      - uploads_volume_prod:/app/uploads
    networks:
      - attendrix_prod_network
    depends_on:
      - db
      - redis
      - web
    healthcheck:
      test: ["CMD", "celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Celery Beat Scheduler (production)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_celery_beat_prod
    restart: always
    command: celery -A attendrix beat --loglevel=info --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - logs_volume_prod:/app/logs
      - celerybeat_data_prod:/tmp
    networks:
      - attendrix_prod_network
    depends_on:
      - db
      - redis
      - web
    healthcheck:
      test: ["CMD", "pgrep", "-f", "celery beat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Flower - Celery Monitoring (production)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_flower_prod
    restart: always
    command: celery -A attendrix flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD} --max_tasks=10000
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    networks:
      - attendrix_prod_network
    depends_on:
      - redis
      - celery
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Nginx Reverse Proxy (production)
  nginx:
    image: nginx:alpine
    container_name: attendrix_nginx_prod
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/proxy_params:/etc/nginx/proxy_params
      - static_volume_prod:/var/www/static
      - media_volume_prod:/var/www/media
      - ssl_certs:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - attendrix_prod_network
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # Backup Service (production)
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_backup_prod
    restart: always
    command: >
      sh -c "
      while true; do
        echo 'Creating backup...'
        python manage.py dbbackup --compress
        python manage.py mediabackup --compress
        find /backups -name '*.gz' -mtime +${BACKUP_RETENTION_DAYS:-30} -delete
        echo 'Backup completed. Sleeping for 24 hours...'
        sleep 86400
      done"
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_backups:/backups
      - media_volume_prod:/app/media
    networks:
      - attendrix_prod_network
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

# Production networks
networks:
  attendrix_prod_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# Production volumes
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  static_volume_prod:
    driver: local
  media_volume_prod:
    driver: local
  logs_volume_prod:
    driver: local
  uploads_volume_prod:
    driver: local
  celerybeat_data_prod:
    driver: local
  postgres_backups:
    driver: local
  ssl_certs:
    driver: local
  nginx_logs:
    driver: local
