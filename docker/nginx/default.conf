# Attendrix Nginx Site Configuration
# Default server configuration for Attendrix

# Upstream configuration for Django application
upstream attendrix_backend {
    server web:8000;
    keepalive 32;
}

# HTTP to HTTPS redirect (for production)
server {
    listen 80;
    server_name _;
    
    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect to HTTPS in production
    # Uncomment for production with SSL
    # return 301 https://$server_name$request_uri;
    
    # For development, serve directly
    location / {
        proxy_pass http://attendrix_backend;
        include /etc/nginx/proxy_params;
    }
}

# HTTPS server (for production)
server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozTLS:10m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Root directory
    root /var/www;
    index index.html index.htm;
    
    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Gzip for static files
        gzip_static on;
    }
    
    # Media files
    location /media/ {
        alias /var/www/media/;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        
        # Security for media files
        location ~* \.(php|jsp|asp|sh|py)$ {
            deny all;
        }
    }
    
    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://attendrix_backend;
        include /etc/nginx/proxy_params;
        
        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
        add_header Access-Control-Allow-Credentials true;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Allow-Credentials true;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
    
    # Login endpoint with stricter rate limiting
    location /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://attendrix_backend;
        include /etc/nginx/proxy_params;
    }
    
    # Admin interface
    location /admin/ {
        proxy_pass http://attendrix_backend;
        include /etc/nginx/proxy_params;
        
        # Additional security for admin
        limit_req zone=admin burst=10 nodelay;
    }
    
    # Django application
    location / {
        proxy_pass http://attendrix_backend;
        include /etc/nginx/proxy_params;
    }
    
    # Landing page (if served separately)
    location /landing/ {
        alias /var/www/landing/;
        index index.html;
        try_files $uri $uri/ /landing/index.html;
        
        # Cache landing page
        expires 1h;
        add_header Cache-Control "public";
    }
    
    # Health check
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Security: Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Security: Deny access to configuration files
    location ~* \.(conf|config|ini|log|sh|py|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Rate limiting zones definition
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
