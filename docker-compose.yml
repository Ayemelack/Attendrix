# Attendrix Docker Compose Configuration
# Multi-service orchestration for production deployment

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: attendrix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendrix
      POSTGRES_USER: attendrix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendrix_secure_password_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - attendrix_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendrix -d attendrix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: attendrix_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password_2024}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - attendrix_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_web
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-attendrix_super_secret_key_change_in_production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD:-attendrix_secure_password_2024}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_2024}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - uploads_volume:/app/uploads
    ports:
      - "${WEB_PORT:-8000}:8000"
    networks:
      - attendrix_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_celery
    restart: unless-stopped
    command: celery -A attendrix worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000 --time-limit=300 --prefetch-multiplier=1
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-attendrix_super_secret_key_change_in_production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD:-attendrix_secure_password_2024}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_2024}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - logs_volume:/app/logs
      - uploads_volume:/app/uploads
    networks:
      - attendrix_network
    depends_on:
      - db
      - redis
      - web
    healthcheck:
      test: ["CMD", "celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_celery_beat
    restart: unless-stopped
    command: celery -A attendrix beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-attendrix_super_secret_key_change_in_production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=attendrix
      - DB_USER=attendrix
      - DB_PASSWORD=${DB_PASSWORD:-attendrix_secure_password_2024}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_2024}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - logs_volume:/app/logs
      - celerybeat_data:/tmp
    networks:
      - attendrix_network
    depends_on:
      - db
      - redis
      - web
    healthcheck:
      test: ["CMD", "pgrep", "-f", "celery beat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Flower - Celery Monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: attendrix_flower
    restart: unless-stopped
    command: celery -A attendrix flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower_secure_password_2024}
    environment:
      - DJANGO_SETTINGS_MODULE=attendrix.settings.production
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_2024}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    networks:
      - attendrix_network
    depends_on:
      - redis
      - celery
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: attendrix_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ./docker/ssl:/etc/nginx/ssl
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - attendrix_network
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Networks
networks:
  attendrix_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  uploads_volume:
    driver: local
  celerybeat_data:
    driver: local
